x-common-props: &common-props
  platform: linux/amd64
  restart: unless-stopped
  networks: [s3proxy]

services:
  minio:
    <<: *common-props
    container_name: s3proxy_minio
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z@sha256:640c22768ed5dbc92eacc14502a1b06a1c708fa60431345c78dfc22917062e93
    ports:
    - 127.0.0.1:9000:9000
    - 127.0.0.1:9001:9001
    volumes:
    - s3proxy_minio:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin # pragma: allowlist secret
    command: server --console-address ":9001" /data
    healthcheck:
      test: [CMD, curl, -sf, http://localhost:9000/minio/health/ready]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio-init:
    <<: *common-props
    restart: no
    # See https://hub.docker.com/r/minio/mc/tags
    image: minio/mc:RELEASE.2025-02-08T19-14-21Z@sha256:5e8d8a62846797a34d1aaaafe9d9bebe75ac71229063383eadc497bd0e3f6317
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    entrypoint:
    - /bin/sh
    - -c
    - |
      set -e;
      until /usr/bin/mc config host add minio http://minio:9000 minioadmin minioadmin 2>/dev/null; do echo 'waiting for minio...'; sleep 2; done;
      /usr/bin/mc rb --force "minio/$${MINIO_BUCKET}" || true;
      /usr/bin/mc mb "minio/$${MINIO_BUCKET}";
      /usr/bin/mc anonymous set download "minio/$${MINIO_BUCKET}";
      /usr/bin/mc admin user svcacct add minio minioadmin --access-key "$${MINIO_ACCESS_KEY}" --secret-key "$${MINIO_SECRET_KEY}" || true;
      /usr/bin/mc admin user svcacct list minio minioadmin;
      exit 0;
    depends_on:
      minio:
        condition: service_healthy

  seaweedfs:
    <<: *common-props
    container_name: s3proxy_seaweedfs
    hostname: seaweedfs
    image: chrislusf/seaweedfs:4.39@sha256:c7d6c721b30ae711db766bbbfd40192776e263d4e51e22f57baef7bef93c12c6
    # `-s3.config=/etc/seaweedfs/s3.json` enables SeaweedFS S3 identity-based
    # auth so signed requests with the test credentials get Write/List access.
    # Without this the default anonymous identity is read-only and silently
    # drops writes when an Authorization header is present.
    command: server -dir=/data -master -s3 -ip=seaweedfs -s3.config=/etc/seaweedfs/s3.json
    # Publish only the S3 (:8333) and master (:9333) endpoints. The volume
    # server's :8080 conflicts with the existing fake-gcs-server service on
    # the host; the host does not need direct access to it since s3proxy
    # talks to the in-network `seaweedfs:8333` S3 endpoint.
    ports:
    - 127.0.0.1:9333:9333
    - 127.0.0.1:8333:8333
    healthcheck:
      test: [CMD, curl, -sf, http://localhost:8333/]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
    - s3proxy_seaweedfs_data:/data
    - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  # SeaweedFS S3 endpoint listens on :8333 inside the network and defaults to
  # anonymous access. We create a bucket via `mc` so integration tests have a
  # stable target bucket. If you later configure identity-based SeaweedFS S3,
  # add the access key / secret via `mc admin user svcacct add` here.
  seaweedfs-init:
    <<: *common-props
    restart: no
    image: minio/mc:RELEASE.2025-02-08T19-14-21Z@sha256:5e8d8a62846797a34d1aaaafe9d9bebe75ac71229063383eadc497bd0e3f6317
    environment:
      SEAWEEDFS_BUCKET: ${SEAWEEDFS_BUCKET:?SEAWEEDFS_BUCKET is required}
    entrypoint:
    - /bin/sh
    - -c
    - |
      set -e;
      until /usr/bin/mc config host add weed http://seaweedfs:8333 anonymous anonymous 2>/dev/null; do echo 'waiting for seaweedfs S3...'; sleep 2; done;
      /usr/bin/mc rb --force "weed/$${SEAWEEDFS_BUCKET}" || true;
      /usr/bin/mc mb "weed/$${SEAWEEDFS_BUCKET}";
      /usr/bin/mc anonymous set download "weed/$${SEAWEEDFS_BUCKET}";
      /usr/bin/mc ls weed/;
      exit 0;
    depends_on:
      seaweedfs:
        condition: service_healthy

  azurite:
    <<: *common-props
    container_name: s3proxy_azurite
    # See https://github.com/Azure/Azurite/tags
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0@sha256:647c63a91102a9d8e8000aab803436e1fc85fbb285e7ce830a82ee5d6661cf37
    restart: always
    environment:
      AZURITE_ACCOUNTS: ${AZURITE_ACCOUNT_NAME}:${AZURITE_ACCOUNT_KEY}
    ports:
    - 127.0.0.1:10000:10000
    - 127.0.0.1:10001:10001
    volumes:
    - s3proxy_azurite:/home/host
    command: azurite --blobHost 0.0.0.0 --blobPort 10000 --location /home/host --debug /home/host/azure.log

  # See https://github.com/fsouza/fake-gcs-server
  # See https://hub.docker.com/r/fsouza/fake-gcs-server/tags
  fake-gcs-server:
    <<: *common-props
    container_name: s3proxy_fake_gcs_server
    image: fsouza/fake-gcs-server:1.54.0@sha256:3730da0e31f7e5186a90ec4899dc2c336104e7599df400411392ef17e684c31f
    restart: always
    ports:
    - 127.0.0.1:${FAKE_GCP_PORT:?FAKE_GCP_PORT is required}:${FAKE_GCP_PORT}
    volumes:
    - s3proxy_fake_gcs_server:/data
    environment:
      FAKE_GCP_BUCKET: ${FAKE_GCP_BUCKET:?FAKE_GCP_BUCKET is required}
      FAKE_GCP_PORT: ${FAKE_GCP_PORT:?FAKE_GCP_PORT is required}
    entrypoint:
    - /bin/sh
    - -c
    - |
      set -eu
      mkdir -p "/data/$${FAKE_GCP_BUCKET}"
      exec /bin/fake-gcs-server -data /data -scheme http -port "$${FAKE_GCP_PORT}" -public-host "localhost:$${FAKE_GCP_PORT}" -backend memory

  s3-error:
    <<: *common-props
    container_name: s3proxy_s3_error
    image: python:3.13-alpine@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d
    restart: always
    ports:
    - 127.0.0.1:18081:8080
    command:
    - python
    - -c
    - |
      from http.server import BaseHTTPRequestHandler, HTTPServer
      class H(BaseHTTPRequestHandler):
          def do_GET(self):
              self.send_response(500)
              self.end_headers()
              self.wfile.write(b'<Error><Code>InternalError</Code></Error>')
          def do_HEAD(self):
              self.send_response(500)
              self.end_headers()
          def log_message(self, *args):
              pass
      HTTPServer(('0.0.0.0', 8080), H).serve_forever()
    healthcheck:
      test: [CMD, python, -c, "import urllib.error,urllib.request; exec(\"try:\\n urllib.request.urlopen('http://localhost:8080/')\\nexcept urllib.error.HTTPError as e:\\n assert e.code == 500\")"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  s3proxy_minio:
  s3proxy_seaweedfs_data:
  s3proxy_azurite:
  s3proxy_fake_gcs_server:

networks:
  s3proxy:
    driver: bridge
