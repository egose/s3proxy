name: Test

on:
  pull_request:
    paths-ignore:
    - '**.md'
  push:
    paths-ignore:
    - '**.md'

jobs:
  vet-build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup Tools (asdf)
      uses: ./.github/actions/setup-tools

    - name: go vet
      run: make vet

    - name: go build (host)
      run: make build

    - name: go build (all targets)
      run: make build-all

  unit-test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup Tools (asdf)
      uses: ./.github/actions/setup-tools

    - name: go test ./...
      run: make test

    - name: go test -race ./...
      run: make test-race

  integration-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup Tools (asdf)
      uses: ./.github/actions/setup-tools

    # Materialize a .env from .env.example so the sandbox stack and s3proxy
    # pick up the placeholder credentials used by integration-config.hcl.
    - name: Create .env
      run: cp .env.example .env

    # One-shot: starts the docker-compose sandbox stack, builds s3proxy,
    # launches it with .env loaded, runs `go test -tags integration`, and
    # tears down the proxy and stack — propagating the test exit code.
    - name: Run integration tests against sandbox stack
      run: make sandbox-integration-up
