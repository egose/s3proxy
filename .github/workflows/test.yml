name: Test

on:
  workflow_call:
  pull_request:
    paths-ignore:
    - '**.md'
  push:
    branches: [main, dev]
    paths-ignore:
    - '**.md'

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vet-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false

    - name: Setup Tools (asdf)
      uses: ./.github/actions/setup-tools

    - name: Install root npm dependencies
      run: pnpm install --frozen-lockfile

    - name: go vet
      run: make check-toolchain vet

    - name: Validate workflows, shell, and Compose
      run: |
        actionlint
        shellcheck bin/* scripts/*.sh tests/*.sh .bin/*.sh
        cp .env.example .env
        docker-compose --env-file .env -f sandbox/docker-compose.yml config --quiet

    - name: go build (host)
      run: make build

    - name: Build and verify release archives
      run: |
        pnpm release:build -- --version dev
        pnpm release:verify -- --version dev --reproducibility

    - name: Test asdf plugin
      run: make test-asdf

  unit-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false

    - name: Setup Tools (asdf)
      uses: ./.github/actions/setup-tools

    - name: go test ./...
      run: make test

    - name: go test -race ./...
      run: make test-race

  integration-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false

    - name: Setup Tools (asdf)
      uses: ./.github/actions/setup-tools

    # Materialize a .env from .env.example so the sandbox stack and s3proxy
    # pick up the placeholder credentials used by integration-config.hcl.
    - name: Create .env
      run: cp .env.example .env

    # One-shot: starts the docker-compose sandbox stack, builds s3proxy,
    # launches it with .env loaded, runs `go test -tags integration`, and
    # tears down the proxy and stack — propagating the test exit code.
    - name: Run integration tests against sandbox stack
      run: make sandbox-integration-up

    - name: Clean up integration stack
      if: always()
      run: make sandbox-integration-down
