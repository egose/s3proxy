name: Release

on:
  push:
    tags:
    - v*.*.*

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/test.yml

  verify:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Validate release tag and source commit
      run: bash scripts/validate-release-tag.sh "$RELEASE_TAG"
      env:
        RELEASE_TAG: ${{ github.ref_name }}

    - name: Setup Tools
      uses: ./.github/actions/setup-tools

    - name: Install root npm dependencies
      run: pnpm install --frozen-lockfile

    - name: Build and verify release archives
      env:
        VERSION: ${{ github.ref_name }}
      run: |
        pnpm release:build -- --version "$VERSION"
        pnpm release:verify -- --version "$VERSION" --reproducibility

    - name: Generate binary SBOM
      uses: anchore/sbom-action@8e94d75ddd33f69f691467e42275782e4bfefe84
      with:
        path: dist
        format: spdx-json
        output-file: dist/s3proxy.spdx.json
        upload-artifact: false

    - name: Finalize release checksums
      run: (cd dist && sha256sum s3proxy.spdx.json >>SHA256SUMS)

    - name: Attest binary provenance
      uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
      with:
        subject-path: |
          dist/*.tar.gz
          dist/SHA256SUMS
          dist/s3proxy.spdx.json

    - name: Upload verified release artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: s3proxy-${{ github.ref_name }}
        path: |
          dist/*.tar.gz
          dist/SHA256SUMS
          dist/s3proxy.spdx.json

  release:
    needs:
    - verify
    - publish-image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - name: Download verified release artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: s3proxy-${{ github.ref_name }}
        path: dist

    - name: Publish GitHub release
      uses: softprops/action-gh-release@62c96d0c4e8a889135c1f3a25910db8dbe0e85f7
      with:
        generate_release_notes: true
        files: |
          dist/*.tar.gz
          dist/SHA256SUMS
          dist/s3proxy.spdx.json

  publish-image:
    needs: verify
    permissions:
      contents: read
      packages: write
      security-events: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/publish.yaml
    with:
      ref: ${{ github.sha }}
      tag_name: ${{ github.ref_name }}
